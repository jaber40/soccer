name: Deployment API Test

on:
  push:
    branches:
      - staging

jobs:
  api-test:
    runs-on: ubuntu-latest

    steps:
      - name: Wait for deployment (health check loop)
        run: |
          echo "Waiting for API to be ready..."

          for i in {1..30}; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" "${{ secrets.STAGING_API_URL }}/api/tournaments")

            echo "Attempt $i -> HTTP $STATUS"

            if [ "$STATUS" = "200" ]; then
              echo "API is ready!"
              exit 0
            fi

            sleep 5
          done

          echo "API did not become ready in time"
          exit 1

      - name: Test tournaments API
        run: |
          RESPONSE=$(curl -s -o response.txt -w "%{http_code}" "${{ secrets.STAGING_API_URL }}/api/tournaments")

          echo "HTTP Status: $RESPONSE"
          cat response.txt

          if [ "$RESPONSE" != "200" ]; then
            echo "API test failed with status $RESPONSE"
            cat response.txt
            exit 1
          fi

      - name: Test countries API
        run: |
          RESPONSE=$(curl -s -o response.txt -w "%{http_code}" "${{ secrets.STAGING_API_URL }}/api/countries/1")

          echo "HTTP Status: $RESPONSE"
          cat response.txt

          if [ "$RESPONSE" != "200" ]; then
            echo "API test failed with status $RESPONSE"
            cat response.txt
            exit 1
          fi


      - name: Test contact form API
        run: |
          RESPONSE=$(curl -s -o response.json -w "%{http_code}" \
            -X POST "${{ secrets.STAGING_API_URL }}/api/contact" \
            -H "Content-Type: application/json" \
            -d '{
              "name": "GitHub Actions Test",
              "email": "github-actions-test@example.com",
              "message": "Automated contact form test",
              "website": "github-actions-test"
            }')

          echo "HTTP Status: $RESPONSE"
          cat response.json

          if [ "$RESPONSE" != "200" ]; then
            echo "Contact form API test failed"
            exit 1
          fi

          if ! grep -q '"success":true' response.json; then
            echo "Contact form did not return success:true"
            exit 1
          fi